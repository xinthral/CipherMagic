; Shared starting settings for every Enigma variant (enigma.cpp, enigma.py, enigma.rs)
;   plugs     - Plugboard cables as letter pairs, e.g. AV BS CG DL FU HZ IN KM OW RX
;               Leave empty for 10 random cables (the key is printed at startup)
;   positions - Start position of rotars I, II and III, one letter each (A = 0 ... Z = 25)
;               The first letter is rotar I, the fast rotar that steps on every key press
; Running with --test ignores this file and uses a fixed key with positions AAA.
[enigma]
plugs     =
positions = AAA
